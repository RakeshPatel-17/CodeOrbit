name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Or 9.0 depending on your choice

    # Uncomment when dotnet-api is restored
    # - name: Restore .NET dependencies
    #   run: dotnet restore dotnet-api/
    #
    # - name: Build .NET Backend
    #   run: dotnet build dotnet-api/ --no-restore --configuration Release
    #
    # - name: Run .NET Tests
    #   run: dotnet test dotnet-api/ --no-build --verbosity normal
    - name: Format Check
      run: bunx prettier --check "src/**/*.{ts,tsx,css}"

    - name: Build Application
      run: bun run build

    - name: Run Unit Tests
      run: bun test

    # Uncomment when Playwright E2E tests are added
    # - name: Install Playwright Browsers
    #   run: bunx playwright install --with-deps
    # 
    # - name: Run E2E Tests
    #   run: bun run test:e2e
